<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <linearGradient id="handLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="handRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Outer Glow & Base -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGlow)" stroke="url(#accentGlow)" stroke-width="8" opacity="0.95" filter="url(#dropShadow)"/>

  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>

  <!-- Stylized Modern Handshake Paths -->
  <g filter="url(#glowEffect)">
    <!-- Left Arm & Wrist Entry -->
    <path d="M 95 190 C 130 190, 160 215, 205 240 L 250 265 C 265 273, 280 270, 292 258 C 304 246, 302 230, 288 220 L 240 185 C 220 170, 185 160, 135 170 Z" 
          fill="url(#handLeft)"/>

    <!-- Right Arm & Wrist Entry -->
    <path d="M 417 322 C 382 322, 352 297, 307 272 L 262 247 C 247 239, 232 242, 220 254 C 208 266, 210 282, 224 292 L 272 327 C 292 342, 327 352, 377 342 Z" 
          fill="url(#handRight)"/>

    <!-- Left Hand Thumb Wrapping Upward -->
    <path d="M 215 210 C 235 185, 275 180, 295 205 C 305 218, 300 235, 282 240 C 265 245, 230 235, 215 210 Z" 
          fill="url(#handLeft)" opacity="0.9"/>

    <!-- Right Hand Fingers Clasping Left Hand -->
    <path d="M 230 280 C 210 300, 225 325, 250 325 C 275 325, 305 295, 285 270 C 270 250, 245 260, 230 280 Z" 
          fill="url(#handRight)"/>

    <!-- Interlocking Connection Heart Spark Accent -->
    <path d="M 256 215 C 260 200, 275 198, 282 208 C 290 218, 275 235, 256 248 C 237 235, 222 218, 230 208 C 237 198, 252 200, 256 215 Z" 
          fill="url(#accentGlow)"/>

    <!-- Clean Connection Fluid Arc Overlays -->
    <path d="M 130 195 C 190 215, 270 290, 380 315" 
          fill="none" stroke="url(#accentGlow)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    
    <path d="M 160 315 C 230 305, 300 210, 360 195" 
          fill="none" stroke="url(#handLeft)" stroke-width="4" stroke-linecap="round" opacity="0.5" stroke-dasharray="10 8"/>
  </g>
</svg>
